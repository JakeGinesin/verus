[package]
name = "verus_builtin_macros"
version = "0.0.0-2026-07-27-0206"
edition = "2018"
license = "MIT"
description = "Verus Builtin Macros: Various macros used by Verus"
homepage = "https://github.com/verus-lang/verus"
repository = "https://github.com/verus-lang/verus"
readme = "../../README.md"
keywords = ["verus", "verified-rust", "verification"]
categories = ["development-tools"]

[lib]
proc-macro = true

[dependencies]
convert_case = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
synstructure = { workspace = true }
syn = { workspace = true }
verus_syn = { workspace = true }
verus_prettyplease = { workspace = true }
# PBT integration: the engine that the `contrib-hooks` provider file
# (contrib_hooks_provider.rs, wired up by build.rs) delegates to.
# Optional — only compiled when the `contrib-hooks` feature is enabled,
# so stock verifier builds of this crate are unaffected. vstd's own
# Cargo.toml enables the feature for `cargo build` / `cargo test` /
# `cargo verus verify` runs.
verus_pbt_engine = { path = "../../../verus-pbt/source/engine", optional = true }

[package.metadata.verus]
is-builtin-macros = true

[features]
vpanic = []
contrib-hooks = ["dep:verus_pbt_engine"]

[lints]
workspace = true
