# This toml file is not part of the standard Verus workspace,
# and is not required to build and use Verus.
# Instead, it may optionally be used for compiling an erased vstd library
# for linking with non-Verus Rust code.

[package]
name = "vstd"
version = "0.0.0-2026-09-20-0158"
edition = "2021"
license = "MIT"
description = "Verus Standard Library: Useful specifications and lemmas for verifying Rust code"
documentation = "https://verus-lang.github.io/verus/verusdoc/vstd/"
homepage = "https://github.com/verus-lang/verus"
repository = "https://github.com/verus-lang/verus"
readme = "../../README.md"
keywords = ["verus", "verified-rust", "verification"]
categories = ["development-tools"]

[lib]
name = "vstd"
path = "vstd.rs"
# doc examples are verus syntax, not plain rust
doctest = false

[dependencies]
# verus-spec-check overlay of the macros crate
verus_builtin_macros = { version = "=0.0.0-2026-09-20-0158", path = "../../verus-spec-check/source/builtin_macros_overlay" }
verus_builtin = { version = "=0.0.0-2026-09-16-0054", path = "../builtin" }
verus_state_machines_macros = { version = "=0.0.0-2026-09-06-0133", path = "../state_machines_macros" }

# vcheck hook and runtime only for erased builds, not verus_keep_ghost ones
[target.'cfg(not(verus_keep_ghost))'.dependencies]
verus_builtin_macros = { version = "=0.0.0-2026-09-20-0158", path = "../../verus-spec-check/source/builtin_macros_overlay", features = ["contrib-hooks"] }
verus_spec_check = { path = "../../verus-spec-check/source/verus_spec_check" }
verus_spec_check_vstd_ext = { path = "../../verus-spec-check/source/vstd_ext" }

[features]
# allocator and nonzero_internals un-gate std_specs vec and nonzero
default = ["std", "allocator", "nonzero_internals"]
std = ["alloc"]
alloc = []
allocator = []
strict_provenance_atomic_ptr = []
allow_panic = [] # code is allowed to panic.
nonzero_internals = []


[package.metadata.verus]
verify = true
is-vstd = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(verus_keep_ghost)',
  'cfg(verus_verify_core)',
  'cfg(verus_keep_ghost_body)',
  'cfg(kani)',
] }

[profile.fuzz]
inherits = "release"

# release speed with overflow checks for long vcheck campaigns
[profile.vcheck-intense]
inherits = "release"
debug-assertions = true
overflow-checks = true

# single macros crate for local and registry vstd
[patch.crates-io]
verus_builtin_macros = { path = "../../verus-spec-check/source/builtin_macros_overlay" }
